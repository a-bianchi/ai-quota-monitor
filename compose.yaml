services:
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # Codex may write under HOME; the root filesystem is read-only.
      HOME: /tmp
      CONFIG_NAME: ${CONFIG_NAME:-config.json}
      MOCK_FILE: /app/configs/mock-usage.json
      DATA_DIR: /data
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      MASTER_KEY: ${MASTER_KEY:-}
      CODEX_BIN: codex
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      STALE_AFTER: ${STALE_AFTER:-15m}
      OPENROUTER_PERSONAL_KEY: ${OPENROUTER_PERSONAL_KEY:-}
      CURSOR_WORK_SESSION: ${CURSOR_WORK_SESSION:-}
    volumes:
      - ./server/configs:/app/configs:ro
      - usage-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  usage-data:
